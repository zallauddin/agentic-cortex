<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tales of Vesperia — Save Editor</title>
<style>
:root {
  --bg: #0f0f1a; --surface: #1a1a2e; --surface2: #222240;
  --accent: #e8b44b; --accent2: #6c63ff; --text: #e0e0f0;
  --text2: #9999bb; --green: #4ecdc4; --red: #ff6b6b;
  --border: #2a2a45; --radius: 10px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh;
}
.header {
  background: linear-gradient(135deg, var(--surface), var(--surface2));
  border-bottom: 2px solid var(--accent); padding: 12px 24px;
  display: flex; align-items: center; gap: 16px;
  position: sticky; top: 0; z-index: 100;
}
.header h1 { font-size: 1.3rem; color: var(--accent); }
.header .sub { font-size: 0.75rem; color: var(--text2); }
.ctrls { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.btn {
  background: var(--surface2); color: var(--text);
  border: 1px solid var(--border); padding: 8px 16px;
  border-radius: 8px; cursor: pointer; font-size: 0.82rem;
  transition: all 0.2s; white-space: nowrap;
}
.btn:hover { background: var(--accent2); border-color: var(--accent2); transform: translateY(-1px); }
.btn.accent { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }
.btn.accent:hover { filter: brightness(1.1); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

.container { max-width: 1100px; margin: 0 auto; padding: 16px; }
.upload {
  border: 2px dashed var(--border); border-radius: var(--radius);
  padding: 40px; text-align: center; cursor: pointer; transition: all 0.3s;
  background: var(--surface); margin: 12px 0;
}
.upload:hover { border-color: var(--accent2); background: var(--surface2); }
.upload.drag { border-color: var(--accent); background: rgba(232,180,75,0.08); }
.upload .ic { font-size: 2.5rem; margin-bottom: 8px; }

.section {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); margin-bottom: 12px; overflow: hidden;
}
.section-header {
  padding: 12px 16px; cursor: pointer; display: flex; align-items: center;
  gap: 10px; user-select: none; transition: background 0.2s;
}
.section-header:hover { background: rgba(108,99,255,0.06); }
.section-header h3 { font-size: 0.95rem; flex: 1; }
.section-header .badge { font-size: 0.7rem; background: var(--accent2); color: #fff; padding: 2px 8px; border-radius: 20px; }
.section-body { padding: 0 16px 16px; display: none; }
.section.open .section-body { display: block; }
.section.open .section-header { border-bottom: 1px solid var(--border); }

input[type="number"], input[type="text"] {
  background: var(--bg); border: 1px solid var(--border);
  color: var(--text); padding: 6px 10px; border-radius: 6px;
  font-size: 0.82rem; transition: border-color 0.2s;
}
input:focus { outline: none; border-color: var(--accent2); }
input.changed { border-color: var(--accent); background: rgba(232,180,75,0.08); }

.gald-val { font-size: 2rem; font-weight: 700; color: var(--accent); }
.gald-val input { font-size: 2rem; font-weight: 700; color: var(--accent); background: transparent; border: none; border-bottom: 2px dashed var(--border); width: 180px; }
.gald-val input:focus { border-color: var(--accent2); }

.stat-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 6px; }
.stat-row label { font-size: 0.68rem; color: var(--text2); text-transform: uppercase; display: block; }
.stat-row input { width: 100%; }

.equip-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
.equip-row label { font-size: 0.65rem; color: var(--text2); text-transform: uppercase; display: block; margin-bottom: 2px; }
.equip-row select { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--border); padding: 5px 8px; border-radius: 6px; font-size: 0.78rem; }
.equip-row select:focus { outline: none; border-color: var(--accent2); }
.equip-row select.changed { border-color: var(--accent); background: rgba(232,180,75,0.08); }

.item-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
.item-table th { text-align: left; padding: 6px 10px; color: var(--text2); font-size: 0.68rem; text-transform: uppercase; border-bottom: 1px solid var(--border); }
.item-table td { padding: 4px 10px; border-bottom: 1px solid rgba(255,255,255,0.03); }
.item-table tr:hover td { background: rgba(108,99,255,0.04); }
.item-table .id-col { color: var(--text2); font-size: 0.72rem; width: 50px; }
.item-table .name-col { font-weight: 500; }
.item-table input[type="number"] { width: 60px; text-align: center; }
.item-table input.named { border-color: var(--green); }

.skill-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 5px; }
.skill-chip {
  padding: 5px 10px; border-radius: 18px; font-size: 0.76rem;
  cursor: pointer; transition: all 0.15s; user-select: none;
  background: var(--bg); border: 1px solid var(--border); color: var(--text2);
  display: flex; align-items: center; gap: 5px;
}
.skill-chip.on { background: rgba(78,205,196,0.15); border-color: var(--green); color: var(--green); }
.skill-chip:hover { transform: scale(1.02); border-color: var(--accent2); }
.skill-chip.named { font-weight: 500; }

.party-row { display: flex; gap: 10px; flex-wrap: wrap; }
.party-slot {
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 14px; text-align: center;
  min-width: 90px;
}
.party-slot .num { font-size: 0.65rem; color: var(--text2); }
.party-slot .name { font-weight: 600; font-size: 0.85rem; }
.party-slot select { background: var(--surface2); color: var(--text); border: 1px solid var(--border); padding: 2px 6px; border-radius: 4px; margin-top: 4px; font-size: 0.72rem; }

.meta { display: flex; gap: 12px; flex-wrap: wrap; color: var(--text2); font-size: 0.75rem; margin-bottom: 12px; }
.meta span { background: var(--bg); padding: 4px 10px; border-radius: 20px; white-space: nowrap; }

.filter { margin-bottom: 8px; display: flex; gap: 8px; }
.filter input { width: 180px; }

.toast {
  position: fixed; bottom: 20px; right: 20px; z-index: 999;
  background: var(--surface2); border: 1px solid var(--accent);
  color: var(--accent); padding: 12px 20px; border-radius: var(--radius);
  font-size: 0.82rem; opacity: 0; transition: opacity 0.3s; pointer-events: none;
}
.toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="header">
  <h1>⚔️ Tales of Vesperia</h1>
  <span class="sub">Save Editor</span>
  <div class="ctrls">
    <button class="btn" id="btnReset" onclick="resetAll()" disabled>↺ Reset</button>
    <button class="btn accent" id="btnApply" onclick="applyAll()" disabled>💾 Apply & Download</button>
  </div>
</div>

<div class="container">
  <div id="uploadZone" class="upload" onclick="document.getElementById('fileIn').click()">
    <div class="ic">📂</div>
    <h3>Drop save file or click to browse</h3>
    <p style="color:var(--text2);font-size:0.8rem">tlsavedata0_00 … _08 (838,872 bytes)</p>
    <input type="file" id="fileIn" hidden onchange="loadFile(this.files[0])">
  </div>

  <div id="editor" style="display:none">
    <div class="meta" id="metaInfo"></div>
    <div id="sections"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let parsed = null;
let origBuf = null;
let changes = {};

const API = '';

// ─── Upload ────────────────────────────────────────────────────
const uz = document.getElementById('uploadZone');
uz.addEventListener('dragover', e => { e.preventDefault(); uz.classList.add('drag'); });
uz.addEventListener('dragleave', () => uz.classList.remove('drag'));
uz.addEventListener('drop', e => {
  e.preventDefault(); uz.classList.remove('drag');
  if (e.dataTransfer.files.length) loadFile(e.dataTransfer.files[0]);
});

async function loadFile(file) {
  if (!file || file.size !== 838872) { toast('❌ Expected 838,872 bytes', true); return; }
  toast('Loading...');
  const buf = await file.arrayBuffer();
  await parseAndShow(new Uint8Array(buf));
}

// Called by Electron menu File → Open (via IPC)
function loadFileFromBuffer(fileName, buffer) {
  if (buffer.byteLength !== 838872) { toast('❌ Expected 838,872 bytes', true); return; }
  toast('Loading ' + fileName + '...');
  parseAndShow(new Uint8Array(buffer));
}

async function parseAndShow(arr) {
  const r = await fetch(API + '/api/tov/parse', { method: 'POST', body: arr });
  if (!r.ok) { toast('❌ ' + ((await r.json()).error || 'Parse failed'), true); return; }
  parsed = await r.json();
  origBuf = arr;
  changes = {};
  uz.style.display = 'none';
  document.getElementById('editor').style.display = 'block';
  document.getElementById('btnReset').disabled = false;
  document.getElementById('btnApply').disabled = false;
  render();
  toast('✅ Save #' + parsed.header.saveId + ' loaded');
  // Notify Electron main process that a save is loaded (enables File → Save As)
  if (window.electronAPI) window.electronAPI.saveLoaded(true);
}

// ─── Render ────────────────────────────────────────────────────
function render() {
  const d = parsed;
  document.getElementById('metaInfo').innerHTML =
    `<span>💾 #${d.header.saveId}</span><span>💰 ${d.gald.gald.toLocaleString()}</span><span>⭐ Grade ${d.gald.grade}</span><span>⚔️ ${d.gald.killCount} kills</span><span>👥 ${d.characters.length} chars</span><span>🎒 ${Object.values(d.items).reduce((s,c)=>s+c.items.length,0)} items</span>`;

  let html = '';

  // ── Gald & Grade ──
  const g = d.gald;
  html += `<div class="section open" id="sec-gald">
    <div class="section-header" onclick="toggleSection('sec-gald')"><h3>💰 Gald & Grade</h3></div>
    <div class="section-body">
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px">
        <div><label style="color:var(--text2);font-size:0.68rem">GALD</label>
          <div class="gald-val"><input type="number" value="${g.gald}" onchange="chg('gald',+this.value);this.classList.add('changed')" id="inpGald"></div></div>
        <div><label style="color:var(--text2);font-size:0.68rem">MAX GALD</label>
          <div class="gald-val"><input type="number" value="${g.maxGald}" onchange="chg('maxGald',+this.value);this.classList.add('changed')" id="inpMaxGald"></div></div>
        <div><label style="color:var(--text2);font-size:0.68rem">GRADE (NG+)</label>
          <div class="gald-val"><input type="number" step="0.01" value="${g.grade}" onchange="chg('grade',parseFloat(this.value));this.classList.add('changed')" id="inpGrade"></div></div>
        <div class="stat-row"><label>Save Count</label><span style="font-size:1.1rem;font-weight:600">${g.saveCount}</span></div>
        <div class="stat-row"><label>Encounters</label><span style="font-size:1.1rem;font-weight:600">${g.encountCount}</span></div>
        <div class="stat-row"><label>Kill Count</label><span style="font-size:1.1rem;font-weight:600">${g.killCount}</span></div>
        <div class="stat-row"><label>Max Hit Count</label><span style="font-size:1.1rem;font-weight:600">${g.maxHitCount || 0}</span></div>
        <div class="stat-row"><label>Max Damage</label><span style="font-size:1.1rem;font-weight:600">${(g.maxDamage || 0).toLocaleString()}</span></div>
      </div>
    </div>
  </div>`;

  // ── Items ──
  html += `<div class="section" id="sec-items">
    <div class="section-header" onclick="toggleSection('sec-items')"><h3>🎒 Items</h3><span class="badge">${Object.keys(d.items).length} categories</span></div>
    <div class="section-body"><div class="filter"><input placeholder="🔍 Filter items..." oninput="filterItems(this.value)"></div>`;
  for (const [catKey, cat] of Object.entries(d.items)) {
    html += `<div class="item-cat"><h4 style="font-size:0.85rem;color:var(--accent);margin:10px 0 4px">${cat.icon} ${cat.name} (${cat.items.length})</h4>
      <table class="item-table"><thead><tr><th>ID</th><th>Name</th><th>Qty</th></tr></thead><tbody>`;
    for (const it of cat.items) {
      const name = it.name || `${catKey} #${it.id}`;
      html += `<tr><td class="id-col">#${it.id}</td><td class="name-col">${name}</td>
        <td><input type="number" min="0" max="99" value="${it.count}" onchange="chgItem(${it.id},+this.value);this.classList.add('changed')"${it.name?' class="named"':''}></td></tr>`;
    }
    html += '</tbody></table></div>';
  }
  html += '</div></div>';

  // ── Characters ──
  html += `<div class="section open" id="sec-chars">
    <div class="section-header" onclick="toggleSection('sec-chars')"><h3>👥 Characters</h3><span class="badge">${d.characters.length}</span></div>
    <div class="section-body">`;
  for (const ch of d.characters) {
    const s = ch.stats;
    html += `<div class="section" id="sec-char-${ch.id}">
      <div class="section-header" onclick="toggleSection('sec-char-${ch.id}')">
        <h3>${ch.name}</h3><span class="badge">LV ${s.lv}</span>
        <span style="font-size:0.72rem;color:var(--text2)">HP ${s.hp}/${s.maxHp} TP ${s.tp}/${s.maxTp} SP ${s.sp}/${s.maxSp} | ${ch.skillCount} skills</span>
      </div>
      <div class="section-body">
        <div class="stat-row">
          ${statInput(ch.id,'lv','Level')} ${statInput(ch.id,'hp','HP')} ${statInput(ch.id,'maxHp','Max HP')}
          ${statInput(ch.id,'tp','TP')} ${statInput(ch.id,'maxTp','Max TP')} ${statInput(ch.id,'sp','SP')}
          ${statInput(ch.id,'maxSp','Max SP')} ${statInput(ch.id,'exp','EXP')}
          ${statInput(ch.id,'physAtk','Phys Atk')} ${statInput(ch.id,'magAtk','Mag Atk')}
          ${statInput(ch.id,'physDef','Phys Def')} ${statInput(ch.id,'magDef','Mag Def')}
          ${statInput(ch.id,'speed','Speed')} ${statInput(ch.id,'lucky','Luck')}
        </div>
        <div class="equip-row">
          ${equipSelect(ch.id,'equipMain','mains',s.equipMain,'⚔️ Main')}
          ${equipSelect(ch.id,'equipSub','subs',s.equipSub,'🗡️ Sub')}
          ${equipSelect(ch.id,'equipHead','heads',s.equipHead,'⛑️ Head')}
          ${equipSelect(ch.id,'equipBody','bodys',s.equipBody,'🛡️ Body')}
        </div>
        <h4 style="margin:10px 0 6px;font-size:0.8rem;color:var(--accent)">Skills (${ch.skillCount} learned)</h4>
        <div class="skill-grid">`;
    const learnedSet = new Set(ch.skills.map(sk => sk.id));
    for (let si = 0; si < 160; si++) {
      const on = learnedSet.has(si);
      const sn = ch.skills.find(sk => sk.id === si);
      const label = (sn && sn.name) ? sn.name : ('Skill #' + si);
      html += `<div class="skill-chip ${on?'on':''} ${(sn&&sn.name)?'named':''}" onclick="tglSkill(${ch.id},${si},${!on});this.classList.toggle('on')">
        ${on?'✅':'⬜'} ${label}</div>`;
    }
    html += '</div></div></div>';
  }
  html += '</div></div>';

  // ── Party ──
  html += `<div class="section" id="sec-party">
    <div class="section-header" onclick="toggleSection('sec-party')"><h3>👥 Party Order</h3></div>
    <div class="section-body"><div class="party-row">`;
  for (const sl of d.party) {
    html += `<div class="party-slot"><div class="num">Slot ${sl.slot+1}</div><div class="name">${sl.name}</div>
      <select onchange="chgParty(${sl.slot},+this.value)">`;
    for (const [id, nm] of Object.entries({1:'Yuri',2:'Repede',3:'Judith',4:'Karol',5:'Patty',6:'Flynn',7:'Raven',8:'Rita',9:'Estelle'}))
      html += `<option value="${id}" ${sl.memberId==id?'selected':''}>${nm}</option>`;
    html += '</select></div>';
  }
  html += '</div></div></div>';

  document.getElementById('sections').innerHTML = html;
}

function chgEquip(mid, key, val) {
  if (!changes.equipChanges) changes.equipChanges = [];
  let e = changes.equipChanges.find(c => c.memberId === mid);
  if (!e) { e = { memberId: mid }; changes.equipChanges.push(e); }
  e[key] = val;
  event.target.classList.add('changed');
}

function equipSelect(cid, key, catKey, curId, label) {
  const cat = parsed.items[catKey];
  const seen = new Set();
  let opts = `<option value="0">— None —</option>`;
  // always include current equipped item
  if (curId > 0) {
    const found = cat && cat.items.find(i => i.id === curId);
    const curName = found ? (found.name || `#${curId}`) : `#${curId}`;
    opts += `<option value="${curId}" selected>${curName}</option>`;
    seen.add(curId);
  }
  // add all owned items from the category
  if (cat) {
    for (const it of cat.items) {
      if (seen.has(it.id)) continue;
      seen.add(it.id);
      const nm = it.name || `#${it.id}`;
      opts += `<option value="${it.id}" ${it.id===curId?'selected':''}>${nm}</option>`;
    }
  }
  return `<div><label>${label}</label><select onchange="chgEquip(${cid},'${key}',+this.value)">${opts}</select></div>`;
}

function statInput(cid, key, label) {
  const v = parsed.characters.find(c => c.id === cid).stats[key];
  return `<div><label>${label}</label><input type="number" value="${v}" onchange="chgChar(${cid},'${key}',+this.value);this.classList.add('changed')"></div>`;
}

function toggleSection(id) {
  document.getElementById(id).classList.toggle('open');
}

// ─── Change tracking ───────────────────────────────────────────
function chg(key, val) { changes[key] = val; }
function chgItem(id, cnt) { if (!changes.itemChanges) changes.itemChanges = {}; changes.itemChanges[id] = cnt; }
function chgChar(mid, key, val) {
  if (!changes.charChanges) changes.charChanges = [];
  let e = changes.charChanges.find(c => c.memberId === mid);
  if (!e) { e = { memberId: mid }; changes.charChanges.push(e); }
  e[key] = val;
}
function tglSkill(mid, sid, on) {
  if (!changes.skillChanges) changes.skillChanges = [];
  const ix = changes.skillChanges.findIndex(s => s.memberId === mid && s.skillId === sid);
  if (ix >= 0) changes.skillChanges.splice(ix, 1);
  changes.skillChanges.push({ memberId: mid, skillId: sid, enabled: on });
}
function chgParty(slot, mid) {
  if (!changes.partyChanges) changes.partyChanges = [];
  let e = changes.partyChanges.find(p => p.slot === slot);
  if (!e) { e = { slot, memberId: mid }; changes.partyChanges.push(e); }
  else e.memberId = mid;
}

function filterItems(q) {
  document.querySelectorAll('.item-table tbody tr').forEach(r => {
    r.style.display = !q || r.textContent.toLowerCase().includes(q.toLowerCase()) ? '' : 'none';
  });
}

// ─── Apply & Download ──────────────────────────────────────────
async function applyAll() {
  if (!origBuf) return;
  const btn = document.getElementById('btnApply');
  btn.disabled = true; btn.textContent = '⏳ Working...';

  const r = await fetch(API + '/api/tov/modify', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(changes),
  });
  if (!r.ok) { toast('❌ Failed', true); btn.disabled = false; btn.textContent = '💾 Apply & Download'; return; }

  const newBuf = new Uint8Array(await r.arrayBuffer());
  origBuf = newBuf;

  // Re-parse
  const r2 = await fetch(API + '/api/tov/parse', { method: 'POST', body: newBuf });
  if (r2.ok) {
    parsed = await r2.json();
    changes = {};
    render();
  }

  // Download
  const r3 = await fetch(API + '/api/tov/download');
  const blob = await r3.blob();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'tlsavedata0_modified';
  a.click();

  document.querySelectorAll('.changed').forEach(el => el.classList.remove('changed'));
  btn.disabled = false; btn.textContent = '💾 Apply & Download';
  toast('✅ Changes applied & save downloaded!');
}

async function resetAll() {
  await fetch(API + '/api/tov/rollback');
  const r = await fetch(API + '/api/tov/parse', { method: 'POST', body: origBuf });
  parsed = await r.json();
  changes = {};
  render();
  document.querySelectorAll('.changed').forEach(el => el.classList.remove('changed'));
  toast('↺ Reset to original');
}

function hasPendingChanges() {
  if (Object.keys(changes).length > 0) return true;
  if (changes.itemChanges && Object.keys(changes.itemChanges).length > 0) return true;
  if (changes.charChanges && changes.charChanges.length > 0) return true;
  if (changes.skillChanges && changes.skillChanges.length > 0) return true;
  if (changes.partyChanges && changes.partyChanges.length > 0) return true;
  if (changes.equipChanges && changes.equipChanges.length > 0) return true;
  return false;
}

function toast(msg, err) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.borderColor = err ? 'var(--red)' : 'var(--accent)';
  t.style.color = err ? 'var(--red)' : 'var(--accent)';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ─── Electron IPC — Menu-driven file operations ─────────────────

if (window.electronAPI) {
  // File → Open: main process sent us file data
  window.electronAPI.onMenuOpen((data) => {
    loadFileFromBuffer(data.name, data.buffer);
  });

  // File → Save As: apply changes then save via native dialog
  window.electronAPI.onMenuSave(async () => {
    if (!origBuf) return;
    toast('Applying changes...');

    // Apply any pending changes to the server
    let saveBuf = origBuf;
    if (hasPendingChanges()) {
      const r = await fetch(API + '/api/tov/modify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(changes),
      });
      if (!r.ok) { toast('❌ Failed to apply changes', true); return; }
      const newBuf = new Uint8Array(await r.arrayBuffer());
      origBuf = newBuf;
      saveBuf = newBuf;
      // Re-parse to refresh the display
      const r2 = await fetch(API + '/api/tov/parse', { method: 'POST', body: newBuf });
      if (r2.ok) {
        parsed = await r2.json();
        changes = {};
        render();
      }
    }

    // Save via native dialog (pass buffer directly, no double fetch)
    const result = await window.electronAPI.saveFile(saveBuf, 'tlsavedata0_modified');
    if (result && result.success) {
      toast('✅ Saved to ' + result.filePath.split(/[\\/]/).pop());
    } else if (result && !result.success && !result.canceled) {
      toast('❌ Save failed', true);
    }
  });
}
</script>
</body>
</html>
