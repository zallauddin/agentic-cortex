<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agentic Cortex — 5-Layer Dashboard</title>
<style>
/* ─── Design Tokens ─────────────────────────────────────────── */
:root {
  --bg: #0a0a16;
  --surface: #111128;
  --surface2: #1a1a3a;
  --surface3: #22224a;
  --text: #e4e4f4;
  --text2: #8888b0;
  --text3: #555588;
  --border: #1e1e3e;
  --radius: 12px;
  --radius-sm: 8px;
  /* Layer colors */
  --l1: #ff6b6b;
  --l1-bg: rgba(255,107,107,0.08);
  --l2: #4ecdc4;
  --l2-bg: rgba(78,205,196,0.08);
  --l3: #45b7d1;
  --l3-bg: rgba(69,183,209,0.08);
  --l4: #f9ca24;
  --l4-bg: rgba(249,202,36,0.08);
  --l5: #a55eea;
  --l5-bg: rgba(165,94,234,0.08);
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  height: 100vh;
  overflow: hidden;
}

/* ─── Sidebar ───────────────────────────────────────────────── */
.sidebar {
  width: 260px;
  min-width: 260px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
}

.sidebar-header {
  padding: 20px 20px 16px;
  border-bottom: 1px solid var(--border);
}

.sidebar-header h1 {
  font-size: 1.1rem;
  font-weight: 700;
  background: linear-gradient(135deg, var(--l1), var(--l2), var(--l3), var(--l4), var(--l5));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.sidebar-header .ver {
  font-size: 0.7rem;
  color: var(--text3);
  margin-top: 2px;
}

.nav { padding: 8px; }
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.2s;
  margin-bottom: 2px;
  font-size: 0.85rem;
  color: var(--text2);
  border-left: 3px solid transparent;
}
.nav-item:hover { background: var(--surface2); color: var(--text); }
.nav-item.active {
  background: var(--surface2);
  color: var(--text);
  border-left-color: var(--l2);
}
.nav-item .dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}
.nav-item .dot.l1 { background: var(--l1); }
.nav-item .dot.l2 { background: var(--l2); }
.nav-item .dot.l3 { background: var(--l3); }
.nav-item .dot.l4 { background: var(--l4); }
.nav-item .dot.l5 { background: var(--l5); }

.nav-item .badge {
  margin-left: auto;
  font-size: 0.65rem;
  padding: 2px 8px;
  border-radius: 20px;
  font-weight: 600;
}
.nav-item .badge.ok { background: rgba(78,205,196,0.15); color: var(--l2); }
.nav-item .badge.warn { background: rgba(249,202,36,0.15); color: var(--l4); }
.nav-item .badge.alert { background: rgba(255,107,107,0.15); color: var(--l1); }
.nav-item .badge.info { background: rgba(69,183,209,0.15); color: var(--l3); }

.refresh-btn {
  margin: 8px;
  padding: 10px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text2);
  cursor: pointer;
  font-size: 0.8rem;
  text-align: center;
  transition: all 0.2s;
}
.refresh-btn:hover { background: var(--surface3); color: var(--text); }
.refresh-btn.spinning .r-icon { animation: spin 0.8s linear infinite; }

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }
@keyframes slideIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }

/* ─── Main Content ──────────────────────────────────────────── */
.main {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
}

.panels { display: none; }
.panels.active { display: block; }

/* ─── Header Bar ────────────────────────────────────────────── */
.topbar {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 24px;
  flex-wrap: wrap;
}
.topbar h2 {
  font-size: 1.4rem;
  font-weight: 700;
  flex: 1;
}
.status-pill {
  font-size: 0.72rem;
  padding: 4px 12px;
  border-radius: 20px;
  font-weight: 600;
}
.status-pill.live { background: rgba(78,205,196,0.12); color: var(--l2); }
.status-pill.stale { background: rgba(249,202,36,0.12); color: var(--l4); }

/* ─── Stat Cards Row ────────────────────────────────────────── */
.stat-cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 12px;
  margin-bottom: 24px;
}
.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  animation: slideIn 0.3s ease-out;
}
.stat-card .label {
  font-size: 0.68rem;
  color: var(--text2);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 4px;
}
.stat-card .value {
  font-size: 1.8rem;
  font-weight: 700;
}
.stat-card .sub {
  font-size: 0.7rem;
  color: var(--text3);
  margin-top: 4px;
}

/* ─── Layer Panel ───────────────────────────────────────────── */
.layer-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 20px;
  overflow: hidden;
  animation: slideIn 0.35s ease-out;
}
.layer-panel-header {
  padding: 14px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  user-select: none;
  transition: background 0.2s;
}
.layer-panel-header:hover { background: rgba(255,255,255,0.02); }
.layer-panel-header .l-dot {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  flex-shrink: 0;
}
.layer-panel-header h3 { font-size: 1rem; font-weight: 600; flex: 1; }
.layer-panel-header .arrow {
  font-size: 0.7rem;
  color: var(--text3);
  transition: transform 0.2s;
}
.layer-panel.collapsed .layer-body { display: none; }
.layer-panel.collapsed .arrow { transform: rotate(-90deg); }
.layer-body { padding: 16px 20px; }

/* ─── Data Table ────────────────────────────────────────────── */
.data-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.82rem;
}
.data-table th {
  text-align: left;
  padding: 8px 12px;
  color: var(--text2);
  font-size: 0.68rem;
  text-transform: uppercase;
  border-bottom: 1px solid var(--border);
  letter-spacing: 0.5px;
}
.data-table td {
  padding: 8px 12px;
  border-bottom: 1px solid rgba(255,255,255,0.03);
  color: var(--text);
}
.data-table tr:hover td { background: rgba(255,255,255,0.02); }
.data-table .mono { font-family: 'JetBrains Mono', 'Cascadia Code', monospace; font-size: 0.75rem; }
.data-table .tag {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 12px;
  font-size: 0.65rem;
  font-weight: 600;
}
.tag.v1 { background: var(--l1-bg); color: var(--l1); }
.tag.v2 { background: var(--l2-bg); color: var(--l2); }
.tag.v3 { background: var(--l3-bg); color: var(--l3); }
.tag.v4 { background: var(--l4-bg); color: var(--l4); }
.tag.v5 { background: var(--l5-bg); color: var(--l5); }

/* ─── Alert Banner ──────────────────────────────────────────── */
.alert-banner {
  padding: 14px 20px;
  border-radius: var(--radius-sm);
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 0.85rem;
}
.alert-banner.warn { background: var(--l4-bg); border: 1px solid rgba(249,202,36,0.25); color: #f9d84a; }
.alert-banner.good { background: var(--l2-bg); border: 1px solid rgba(78,205,196,0.25); color: #5eddd5; }
.alert-banner.err { background: var(--l1-bg); border: 1px solid rgba(255,107,107,0.25); color: #ff8585; }

/* ─── Template Card ─────────────────────────────────────────── */
.template-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 10px;
}
.tpl-card {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 14px;
  cursor: pointer;
  transition: all 0.2s;
}
.tpl-card:hover {
  border-color: var(--l1);
  transform: translateY(-2px);
  box-shadow: 0 4px 20px rgba(255,107,107,0.08);
}
.tpl-card.expanded {
  border-color: var(--l1);
  grid-column: 1 / -1;
}
.tpl-detail {
  animation: slideIn 0.25s ease-out;
}
.tpl-card .tpl-name {
  font-weight: 600;
  font-size: 0.85rem;
  margin-bottom: 4px;
}
.tpl-card .tpl-desc {
  font-size: 0.72rem;
  color: var(--text2);
  margin-bottom: 8px;
}
.tpl-card .tpl-meta {
  display: flex;
  gap: 8px;
  font-size: 0.65rem;
  color: var(--text3);
}

/* ─── FSM State Visualization ───────────────────────────────── */
.fsm-states {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 8px;
}
.fsm-state {
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 0.78rem;
  font-weight: 500;
  border: 1px solid var(--border);
  background: var(--bg);
  transition: all 0.2s;
}
.fsm-state.active {
  background: rgba(165,94,234,0.15);
  border-color: var(--l5);
  color: var(--l5);
  animation: pulse 2s ease-in-out infinite;
}

/* ─── Workflow Progress Bar ─────────────────────────────────── */
.wf-progress {
  display: flex;
  align-items: center;
  gap: 0;
  margin: 8px 0;
}
.wf-step {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  font-size: 0.65rem;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--border);
  background: var(--bg);
  color: var(--text3);
  flex-shrink: 0;
}
.wf-step.done { border-color: var(--l2); background: rgba(78,205,196,0.15); color: var(--l2); }
.wf-step.current { border-color: var(--l5); background: rgba(165,94,234,0.15); color: var(--l5); animation: pulse 1.5s ease-in-out infinite; }
.wf-connector {
  width: 32px;
  height: 2px;
  background: var(--border);
}
.wf-connector.done { background: var(--l2); }

/* ─── Empty State ───────────────────────────────────────────── */
.empty {
  text-align: center;
  padding: 40px 20px;
  color: var(--text3);
}
.empty .ic { font-size: 2.5rem; margin-bottom: 8px; }
.empty p { font-size: 0.82rem; }

/* ─── Loading ───────────────────────────────────────────────── */
.loader {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 60px;
  flex-direction: column;
  gap: 16px;
}
.loader .spinner {
  width: 40px;
  height: 40px;
  border: 3px solid var(--border);
  border-top-color: var(--l3);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

/* ─── Scrollbar ─────────────────────────────────────────────── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text3); }

/* ─── Plateau Diagnostics ───────────────────────────────────── */
.diagnosis-box {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 16px;
  margin-top: 12px;
}
.diagnosis-box h4 { font-size: 0.85rem; margin-bottom: 8px; color: var(--l4); }
.diagnosis-box p { font-size: 0.78rem; color: var(--text2); line-height: 1.5; }

/* ─── Mini Chart Bars ───────────────────────────────────────── */
.chart-bars {
  display: flex;
  align-items: flex-end;
  gap: 4px;
  height: 60px;
  margin: 10px 0;
}
.chart-bar {
  flex: 1;
  border-radius: 3px 3px 0 0;
  min-width: 8px;
  transition: height 0.4s ease-out;
}
.chart-bar.success { background: var(--l2); }
.chart-bar.failure { background: var(--l1); }
</style>
</head>
<body>

<!-- ─── Sidebar ────────────────────────────────────────────────── -->
<aside class="sidebar">
  <div class="sidebar-header">
    <h1>🧠 Agentic Cortex</h1>
    <div class="ver">5-Layer Dashboard v6.2.0</div>
  </div>
  <nav class="nav">
    <div class="nav-item active" data-panel="overview">
      <span class="dot" style="background:linear-gradient(135deg,var(--l1),var(--l2),var(--l3),var(--l4),var(--l5))"></span>
      Overview
    </div>
    <div class="nav-item" data-panel="layer1">
      <span class="dot l1"></span>
      Layer 1: Prompt Engineering
      <span class="badge info" id="badge-l1">--</span>
    </div>
    <div class="nav-item" data-panel="layer2">
      <span class="dot l2"></span>
      Layer 2: Context Engineering
      <span class="badge ok" id="badge-l2">--</span>
    </div>
    <div class="nav-item" data-panel="layer3">
      <span class="dot l3"></span>
      Layer 3: Harness Engineering
      <span class="badge info" id="badge-l3">--</span>
    </div>
    <div class="nav-item" data-panel="layer4">
      <span class="dot l4"></span>
      Layer 4: Loop Engineering
      <span class="badge ok" id="badge-l4">--</span>
    </div>
    <div class="nav-item" data-panel="layer5">
      <span class="dot l5"></span>
      Layer 5: Graph Engineering
      <span class="badge info" id="badge-l5">--</span>
    </div>
  </nav>
  <button class="refresh-btn" id="refreshBtn" onclick="refreshAll()">
    <span class="r-icon">🔄</span> Refresh All Data
  </button>
  <button class="refresh-btn" id="autoRefreshBtn" onclick="toggleAutoRefresh()">⏸ Auto</button>
  <div style="padding:12px 16px;font-size:0.65rem;color:var(--text3);text-align:center;margin-top:auto;">
    Last refresh: <span id="lastRefresh">--</span>
  </div>
</aside>

<!-- ─── Main Content ──────────────────────────────────────────── -->
<main class="main">
  <!-- Loader -->
  <div id="loader" class="loader">
    <div class="spinner"></div>
    <span style="color:var(--text2)">Loading 5-Layer Brain...</span>
  </div>

  <!-- ── Overview Panel ────────────────────────────────────── -->
  <div id="panel-overview" class="panels"></div>

  <!-- ── Layer 1 Panel ─────────────────────────────────────── -->
  <div id="panel-layer1" class="panels"></div>

  <!-- ── Layer 2 Panel ─────────────────────────────────────── -->
  <div id="panel-layer2" class="panels"></div>

  <!-- ── Layer 3 Panel ─────────────────────────────────────── -->
  <div id="panel-layer3" class="panels"></div>

  <!-- ── Layer 4 Panel ─────────────────────────────────────── -->
  <div id="panel-layer4" class="panels"></div>

  <!-- ── Layer 5 Panel ─────────────────────────────────────── -->
  <div id="panel-layer5" class="panels"></div>
</main>

<script>
// ─── State ───────────────────────────────────────────────────────
let allData = null;
let activePanel = 'overview';

// ─── Navigation ──────────────────────────────────────────────────
document.querySelectorAll('.nav-item').forEach(item => {
  item.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
    item.classList.add('active');
    activePanel = item.dataset.panel;
    showPanel(activePanel);
  });
});

function showPanel(name) {
  document.querySelectorAll('.panels').forEach(p => p.classList.remove('active'));
  const panel = document.getElementById('panel-' + name);
  if (panel) panel.classList.add('active');
}

// ─── Refresh All ─────────────────────────────────────────────────
// Served over HTTP (agentic-cortex serve) — fetches the same payload
// the old Electron IPC (cortex:refresh-all) returned.
async function refreshAll() {
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spinning');
  btn.textContent = '⏳ Refreshing...';

  try {
    const res = await fetch('/dashboard');
    const result = await res.json();
    if (result.success) {
      allData = result.data;
      document.getElementById('lastRefresh').textContent = new Date().toLocaleTimeString();
      document.getElementById('loader').style.display = 'none';
      renderAll();
    } else {
      showError('Failed to load data: ' + (result.error || 'Unknown'));
    }
  } catch (e) {
    showError('Connection error: ' + e.message);
  }

  btn.classList.remove('spinning');
  btn.innerHTML = '<span class="r-icon">🔄</span> Refresh All Data';
}

function showError(msg) {
  document.getElementById('loader').innerHTML =
    '<div style="text-align:center;padding:40px;color:var(--l1)"><p style="font-size:1.2rem">⚠️ ' + msg + '</p>' +
    '<p style="font-size:0.8rem;color:var(--text3);margin-top:8px">Make sure agentic-cortex is initialized in this project.</p>' +
    '<button class="refresh-btn" onclick="refreshAll()" style="margin-top:16px;display:inline-block">🔄 Retry</button></div>';
}

// ─── Render All Panels ───────────────────────────────────────────
function renderAll() {
  renderOverview();
  renderLayer1();
  renderLayer2();
  renderLayer3();
  renderLayer4();
  renderLayer5();
  updateBadges();
  showPanel(activePanel);
}

// ─── Update Badges ───────────────────────────────────────────────
function updateBadges() {
  const d = allData || {};
  document.getElementById('badge-l1').textContent = (d.prompts || []).length + ' tpl';
  document.getElementById('badge-l2').textContent = (d.health && d.health.totalObservations || 0) + ' mem';
  document.getElementById('badge-l3').textContent = '47 tools';
  const stats = d.evalStats || {};
  document.getElementById('badge-l4').textContent = (stats.total || 0) + ' evals';
  document.getElementById('badge-l5').textContent = (d.workflows || []).length + ' wf';
}

// ─── Overview Panel ──────────────────────────────────────────────
function renderOverview() {
  const d = allData || {};
  const h = d.health || {};
  const stats = d.evalStats || {};
  const plateau = d.plateau || {};

  let html = '<div class="topbar"><h2>🧠 5-Layer Brain Overview</h2>' +
    '<span class="status-pill live">● Live</span></div>';

  // Stat cards row
  html += '<div class="stat-cards">';
  html += statCard('📝', 'Prompt Templates', (d.prompts || []).length, 'Layer 1', 'var(--l1)');
  html += statCard('💾', 'Total Memories', h.totalObservations || 0, 'Layer 2', 'var(--l2)');
  html += statCard('🔧', 'MCP Tools', '47', 'Layer 3', 'var(--l3)');
  html += statCard('📊', 'Evaluations', stats.total || 0, 'Layer 4', 'var(--l4)');
  html += statCard('⚙️', 'Workflows', (d.workflows || []).length, 'Layer 5', 'var(--l5)');
  html += '</div>';

  // 5 layer summary cards in a grid
  html += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px">';

  // Layer 1 card
  html += layerSummaryCard('1', 'Prompt Engineering', 'var(--l1)', 'var(--l1-bg)',
    (d.prompts || []).length + ' versioned templates',
    (d.prompts || []).slice(0, 3).map(t => '• ' + t.name + ' (v' + t.version + ')').join('<br>'));

  // Layer 2 card
  html += layerSummaryCard('2', 'Context Engineering', 'var(--l2)', 'var(--l2-bg)',
    (h.totalObservations || 0) + ' observations · ' + (h.embeddedCount || 0) + ' embedded',
    'Hybrid search (FTS5 + semantic)<br>Utility-based ranking<br>Cross-encoder reranking');

  // Layer 3 card
  html += layerSummaryCard('3', 'Harness Engineering', 'var(--l3)', 'var(--l3-bg)',
    '47 MCP tools · Webhooks · Git hooks',
    'stdin JSON-RPC server<br>HTTP API + webhooks<br>Auto-inject git hooks');

  // Layer 4 card
  html += layerSummaryCard('4', 'Loop Engineering', 'var(--l4)', 'var(--l4-bg)',
    (stats.total || 0) + ' evaluations · ' + ((stats.successRate || 0).toFixed(1)) + '% success',
    '6 self-improvement hooks<br>Plateau detection<br>Tiered crystallization');

  // Layer 5 card
  html += layerSummaryCard('5', 'Graph Engineering', 'var(--l5)', 'var(--l5-bg)',
    (d.workflows || []).length + ' workflows · ' + (d.machines || []).length + ' FSM machines',
    'Multi-agent DAG workflows<br>FSM state orchestration<br>Rule engine');

  html += '</div>';

  // Plateau alert if detected
  if (plateau && plateau.plateauDetected) {
    html += '<div class="alert-banner warn" style="margin-top:16px">⚠️ <strong>Plateau Detected</strong> — ' +
      (plateau.diagnosis || 'Improvement has stalled.') + ' <em>' + (plateau.strategy || '') + '</em></div>';
  }

  document.getElementById('panel-overview').innerHTML = html;
}

function statCard(icon, label, value, sub, color) {
  return '<div class="stat-card"><div class="label">' + icon + ' ' + label + '</div>' +
    '<div class="value" style="color:' + color + '">' + value + '</div>' +
    '<div class="sub">' + sub + '</div></div>';
}

function layerSummaryCard(num, title, color, bg, stat, detail) {
  return '<div class="stat-card" style="border-left:3px solid ' + color + '">' +
    '<div class="label" style="color:' + color + '">LAYER ' + num + '</div>' +
    '<div style="font-weight:700;font-size:0.95rem;margin-bottom:4px">' + title + '</div>' +
    '<div style="font-size:0.72rem;color:var(--text2);margin-bottom:6px">' + stat + '</div>' +
    '<div style="font-size:0.68rem;color:var(--text3);line-height:1.6">' + detail + '</div></div>';
}

// ─── Layer 1: Prompt Engineering ─────────────────────────────────
function renderLayer1() {
  const prompts = (allData && allData.prompts) || [];
  let html = '<div class="topbar"><h2 style="color:var(--l1)">📝 Layer 1: Prompt Engineering</h2>' +
    '<span class="status-pill live">' + prompts.length + ' templates</span></div>';

  html += '<p style="color:var(--text2);font-size:0.82rem;margin-bottom:16px">Versioned prompt templates with outcome tracking. Templates are lazily loaded with inline fallbacks. Change a template once, and every LLM call site updates automatically.</p>';

  html += '<div class="template-list">';
  for (const t of prompts) {
    html += '<div class="tpl-card" data-tpl-name="' + t.name + '" onclick="showTemplateDetail(\'' + t.name + '\')">' +
      '<div class="tpl-name">' + t.name + '</div>' +
      '<div class="tpl-desc">' + (t.description || '') + '</div>' +
      '<div class="tpl-meta">' +
      '<span class="tag v1">v' + (t.version || 1) + '</span>' +
      (t.outcomeTracked ? '<span>🔬 outcome tracked</span>' : '') +
      (t.layer ? '<span>layer ' + t.layer + '</span>' : '') +
      '</div></div>';
  }
  html += '</div>';

  document.getElementById('panel-layer1').innerHTML = html;
}

// ─── Layer 2: Context Engineering ────────────────────────────────
function renderLayer2() {
  const h = (allData && allData.health) || {};
  let html = '<div class="topbar"><h2 style="color:var(--l2)">💾 Layer 2: Context Engineering</h2>' +
    '<span class="status-pill live">' + (h.totalObservations || 0) + ' memories</span></div>';

  html += '<p style="color:var(--text2);font-size:0.82rem;margin-bottom:16px">Retrieval-augmented context: hybrid search (FTS5 full-text + BGE embeddings), cross-encoder reranking, utility-based ranking (predicted_utility), freshness scoring, and relationship graph traversal.</p>';

  html += '<div class="stat-cards">';
  html += statCard('📋', 'Total', h.totalObservations || 0, 'observations', 'var(--l2)');
  html += statCard('🧬', 'Embedded', h.embeddedCount || 0, 'with 768-dim vectors', 'var(--l2)');
  html += statCard('🔗', 'Relations', h.relationCount || 0, 'graph edges', 'var(--l2)');
  html += statCard('📅', 'Sessions', h.sessionCount || 0, 'recorded', 'var(--l2)');
  html += '</div>';

  html += '<div class="layer-panel"><div class="layer-panel-header" onclick="this.parentElement.classList.toggle(\'collapsed\')">' +
    '<div class="l-dot" style="background:var(--l2)"></div><h3>Memory Types</h3><span class="arrow">▼</span></div>' +
    '<div class="layer-body"><table class="data-table"><thead><tr><th>Type</th><th>Count</th></tr></thead><tbody>';

  const typeCounts = h.typeCounts || {};

    html += '<tr><td>' + type + '</td><td>' + count + '</td></tr>';
  }
  html += '</tbody></table></div></div>';

  document.getElementById('panel-layer2').innerHTML = html;
}

// ─── Layer 4: Loop Engineering ───────────────────────────────────
function renderLayer4() {
  const stats = (allData && allData.evalStats) || {};
  const plateau = (allData && allData.plateau) || {};
  const analytics = (allData && allData.analytics) || {};

  let html = '<div class="topbar"><h2 style="color:var(--l4)">🔄 Layer 4: Loop Engineering</h2>' +
    '<span class="status-pill live">' + (stats.total || 0) + ' evaluations</span></div>';

  html += '<p style="color:var(--text2);font-size:0.82rem;margin-bottom:16px">Self-improvement loop: 6 continuous hooks (Error RCA, Learning verify, Outcome tracking, Conflict check, Experiment spawn, Plateau detect), immutable evaluation log, tiered crystallization (raw→synthesis→principle), and hypothesis testing experiments.</p>';

  // Plateau alert first
  if (plateau.plateauDetected) {
    html += '<div class="alert-banner warn">⚠️ <strong>Plateau Detected!</strong> Success rate stalled: ' +
      (plateau.currentRate || 0).toFixed(1) + '% (was ' + (plateau.previousRate || 0).toFixed(1) + '%)' +
      (plateau.diagnosis ? '<br><span style="font-size:0.75rem">' + plateau.diagnosis + '</span>' : '') +
      (plateau.strategy ? '<br><span style="font-size:0.75rem"><strong>Strategy:</strong> ' + plateau.strategy + '</span>' : '') +
      '</div>';
  } else if (plateau.checked) {
    html += '<div class="alert-banner good">✅ <strong>No Plateau</strong> — Improvement is on track. ' +
      (stats.total || 0) + ' evaluations, ' + ((stats.successRate || 0).toFixed(1)) + '% success rate.</div>';
  }

  html += '<div class="stat-cards">';
  html += statCard('📊', 'Total Evals', stats.total || 0, 'immutable log', 'var(--l4)');
  html += statCard('✅', 'Success Rate', ((stats.successRate || 0).toFixed(1)) + '%', stats.successCount + ' successes', 'var(--l2)');
  html += statCard('❌', 'Failures', stats.failureCount || 0, 'Root cause analyzed', 'var(--l1)');
  html += statCard('🔬', 'Experiments', stats.experimentCount || 0, 'hypothesis tests', 'var(--l4)');
  html += '</div>';

  html += '<div class="layer-panel"><div class="layer-panel-header" onclick="this.parentElement.classList.toggle(\'collapsed\')">' +
    '<div class="l-dot" style="background:var(--l4)"></div><h3>6 Self-Improvement Hooks</h3><span class="arrow">▼</span></div>' +
    '<div class="layer-body"><table class="data-table"><thead><tr><th>Hook</th><th>Trigger</th><th>Action</th></tr></thead><tbody>' +
    '<tr><td>1. Error RCA</td><td>Every error save</td><td>Classifies outcome, triggers root cause analysis via LLM</td></tr>' +
    '<tr><td>2. Learning Verify</td><td>Every save</td><td>Checks observations against known learnings for verification</td></tr>' +
    '<tr><td>3. Outcome Tracking</td><td>Every save</td><td>Records intent→action→outcome triplet in eval log</td></tr>' +
    '<tr><td>4. Conflict Check</td><td>Every save</td><td>Detects contradictory observations via embedding similarity</td></tr>' +
    '<tr><td>5. Experiment Spawn</td><td>Every 3rd error</td><td>Designs controlled experiment for recurring errors</td></tr>' +
    '<tr><td>6. Plateau Detect</td><td>Every 50 saves</td><td>Checks eval log for stalled improvement, triggers breakthrough analysis</td></tr>' +
    '</tbody></table></div></div>';

  document.getElementById('panel-layer4').innerHTML = html;
}

// ─── Layer 5: Graph Engineering ──────────────────────────────────
function renderLayer5() {
  const workflows = (allData && allData.workflows) || [];
  const machines = (allData && allData.machines) || [];

  let html = '<div class="topbar"><h2 style="color:var(--l5)">⚙️ Layer 5: Graph Engineering</h2>' +
    '<span class="status-pill live">' + workflows.length + ' workflows</span></div>';

  html += '<p style="color:var(--text2);font-size:0.82rem;margin-bottom:16px">Teams of AI agents collaborating: multi-agent DAG workflows with FSM state orchestration, the rule engine for event-driven actions, and the Workflow-FSM bridge that spawns sub-agents as state machines within workflow steps.</p>';

  html += '<div class="stat-cards">';
  html += statCard('🔀', 'Workflows', workflows.length, 'available', 'var(--l5)');
  html += statCard('🤖', 'FSM Machines', machines.length, 'defined', 'var(--l5)');
  html += statCard('👥', 'Multi-Agent', '2', 'code-review + incidents', 'var(--l5)');
  html += '</div>';

  // FSM Machines
  html += '<div class="layer-panel"><div class="layer-panel-header" onclick="this.parentElement.classList.toggle(\'collapsed\')">' +
    '<div class="l-dot" style="background:var(--l5)"></div><h3>FSM State Machines</h3><span class="arrow">▼</span></div>' +
    '<div class="layer-body">';
  if (machines.length === 0) {
    html += '<div class="empty"><div class="ic">🤖</div><p>No FSM machines defined. Use <code>agentic-cortex fsm --start &lt;machine&gt;</code> to create one.</p></div>';
  } else {
    for (const m of machines) {
      html += '<div style="margin-bottom:12px"><strong>' + (m.name || m.id) + '</strong> ' +
        '<span style="font-size:0.7rem;color:var(--text3)">(' + (m.states || []).length + ' states)</span>' +
        '<div class="fsm-states">';
      for (const s of (m.states || [])) {
        const active = s === m.currentState;
        html += '<div class="fsm-state' + (active ? ' active' : '') + '">' + s + '</div>';
      }
      html += '</div></div>';
    }
  }
  html += '</div></div>';

  // Workflows
  html += '<div class="layer-panel"><div class="layer-panel-header" onclick="this.parentElement.classList.toggle(\'collapsed\')">' +
    '<div class="l-dot" style="background:var(--l5)"></div><h3>Multi-Agent Workflows</h3><span class="arrow">▼</span></div>' +
    '<div class="layer-body">';

  const multiWf = workflows.filter(w => w.name && (w.name.includes('review') || w.name.includes('incident') || w.name.includes('squad')));
  if (multiWf.length === 0) {
    html += '<div class="empty"><div class="ic">⚙️</div><p>No multi-agent workflows active. Start one with <code>agentic-cortex workflow --start code-review-team</code></p></div>';
  } else {
    for (const wf of multiWf) {
      html += '<div style="margin-bottom:16px">';
      html += '<strong>' + (wf.displayName || wf.name) + '</strong> ' +
        '<span style="font-size:0.7rem;color:var(--text3)">— ' + (wf.description || '') + '</span>';
      html += '<div class="wf-progress">';
      const steps = wf.steps || [];
      for (let i = 0; i < steps.length; i++) {
        html += '<div class="wf-step done">' + (i + 1) + '</div>';
        if (i < steps.length - 1) html += '<div class="wf-connector done"></div>';
      }
      html += '</div>';
      html += '<div style="font-size:0.7rem;color:var(--text3)">Steps: ' + steps.map(s => s.name || s.id).join(' → ') + '</div>';
      html += '</div>';
    }
  }
  html += '</div></div>';

  document.getElementById('panel-layer5').innerHTML = html;
}

// ─── Template Detail (Layer 1) ───────────────────────────────────
function showTemplateDetail(name) {
  // Collapse any previously expanded template
  document.querySelectorAll('.tpl-card.expanded').forEach(c => {
    if (c.dataset.tplName !== name) c.classList.remove('expanded');
  });

  const card = document.querySelector('.tpl-card[data-tpl-name="' + name + '"]');
  if (!card) return;

  if (card.classList.contains('expanded')) {
    card.classList.remove('expanded');
    return;
  }

  // Show loading state
  const existing = card.querySelector('.tpl-detail');
  if (existing) { card.classList.add('expanded'); return; }

  const detail = document.createElement('div');
  detail.className = 'tpl-detail';
  detail.innerHTML = '<span style="color:var(--text3);font-size:0.7rem">Loading...</span>';
  card.appendChild(detail);
  card.classList.add('expanded');

  fetch('/prompts/render?name=' + encodeURIComponent(name)).then(r => r.json()).then(result => {
    if (result.success && result.data) {
      const t = result.data;
      detail.innerHTML =
        '<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border)">' +
        (t.system ? '<div style="margin-bottom:8px"><strong style="font-size:0.7rem;color:var(--l1)">System:</strong><pre style="font-size:0.68rem;color:var(--text2);background:var(--bg);padding:8px;border-radius:6px;margin-top:4px;white-space:pre-wrap;max-height:200px;overflow-y:auto">' + escapeHtml(t.system) + '</pre></div>' : '') +
        (t.user ? '<div style="margin-bottom:8px"><strong style="font-size:0.7rem;color:var(--l3)">User:</strong><pre style="font-size:0.68rem;color:var(--text2);background:var(--bg);padding:8px;border-radius:6px;margin-top:4px;white-space:pre-wrap;max-height:200px;overflow-y:auto">' + escapeHtml(t.user) + '</pre></div>' : '') +
        '<div style="font-size:0.65rem;color:var(--text3)">Defaults: ' + escapeHtml(JSON.stringify(t.defaults || {})) + '</div>' +
        '</div>';
    } else {
      detail.innerHTML = '<span style="color:var(--l1);font-size:0.7rem">Failed to load</span>';
    }
  }).catch(() => {
    detail.innerHTML = '<span style="color:var(--l1);font-size:0.7rem">Failed to load</span>';
  });
}

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── Init ────────────────────────────────────────────────────────
let autoRefreshTimer = null;

function toggleAutoRefresh() {
  const btn = document.getElementById('autoRefreshBtn');
  if (autoRefreshTimer) {
    clearInterval(autoRefreshTimer);
    autoRefreshTimer = null;
    btn.textContent = '⏸ Auto';
    btn.style.borderColor = 'var(--border)';
  } else {
    autoRefreshTimer = setInterval(refreshAll, 30000);
    btn.textContent = '⏱ Auto (30s)';
    btn.style.borderColor = 'var(--l2)';
  }
}
document.addEventListener('DOMContentLoaded', () => {
  showPanel('overview');
  refreshAll();
});

// Keyboard shortcut: Ctrl+R to refresh
document.addEventListener('keydown', (e) => {
  if (e.ctrlKey && e.key === 'r') {
    e.preventDefault();
    refreshAll();
  }
});
</script>
